name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install aiohttp -r console/requirements.txt
      - run: bash -n ./*.sh
      - run: python -m py_compile lib/*.py
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile console/*.py
      - run: bash -n console/*.sh
      - run: node --check console/static/app.js
      - run: node --check console/static/policy.js
